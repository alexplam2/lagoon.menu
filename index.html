<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LAGOON · Menu</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1fbfd;--bg2:#d4f6fb;--card:#fff;--ink:#07324a;--mut:#4f7285;--ac:#0588c9;--ac2:#12c3e0;--line:#cfeaf2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#04202e;--bg2:#06394d;--card:#0a3347;--ink:#e6f9fd;--mut:#8fbccb;--ac:#37d4ee;--line:#14506a}}
:root[data-theme="dark"]{--bg:#04202e;--bg2:#06394d;--card:#0a3347;--ink:#e6f9fd;--mut:#8fbccb;--ac:#37d4ee;--line:#14506a}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Poppins,system-ui,sans-serif;-webkit-text-size-adjust:100%}
.hero{text-align:center;padding:28px 20px 18px;background:linear-gradient(var(--bg2),var(--bg))}
.hero img{width:104px;height:auto}
.k{letter-spacing:.38em;font-size:11px;font-weight:600;color:var(--ac);margin-top:10px}
h1{margin:4px 0 6px;font-size:44px;font-weight:800;letter-spacing:.04em;background:linear-gradient(90deg,#0588c9,#12c3e0);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mut);font-size:14px;margin:0 0 14px}
.lg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px}
.lg button{border:0;background:none;color:var(--mut);font:600 13px Poppins,sans-serif;padding:7px 16px;border-radius:99px}
.lg button.on{background:linear-gradient(90deg,#0588c9,#12c3e0);color:#fff}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:8px;overflow-x:auto;padding:10px 16px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{flex:none;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:99px;padding:7px 14px;font-size:13px;font-weight:500}
main{padding:8px 16px 32px;max-width:640px;margin:0 auto}
h2{font-size:24px;font-weight:700;margin:30px 0 4px;display:flex;align-items:center;gap:12px}
h2:after{content:"";flex:1;border-top:2px dashed var(--line)}
h4{margin:20px 0 2px;color:var(--ac);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.it{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dotted var(--line)}
.ph{flex:none;width:88px;height:88px;object-fit:cover;border-radius:16px;background:#0b1a22;box-shadow:0 4px 12px rgba(5,136,201,.18)}
.nm{flex:1;min-width:0;font-weight:600;font-size:15px}.nm small{display:block;font-weight:400;color:var(--mut);font-size:12.5px;margin-top:2px}
.pr{text-align:right;white-space:nowrap;font-size:13px}.pr i{font-style:normal;color:var(--mut)}.pr b{font-weight:700;font-size:15px;color:var(--ac)}
.sc{display:grid;grid-template-columns:1fr 100px;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px 14px 18px 16px;margin:14px 0;box-shadow:0 6px 20px rgba(5,136,201,.08)}
.hd{display:flex;align-items:center;gap:10px}
.pc{flex:none;width:54px;height:54px;border:1.5px dashed var(--mut);border-radius:50%;display:grid;place-items:center;font-size:10px;color:var(--mut);text-align:center}
.sc h3{margin:0;font-size:20px;font-weight:700}
.bd{display:inline-block;background:var(--ac);color:#fff;font-size:11px;font-weight:600;padding:4px 11px;border-radius:99px;margin-top:10px}
.sc ul{list-style:none;padding:0;margin:12px 0 8px}
.sc li{display:flex;align-items:center;gap:8px;font-size:13.5px;padding:3px 0}
.sc li s{flex:none;width:11px;height:11px;border-radius:50%;border:1px solid rgba(0,0,0,.12)}
.sc li span{flex:1}.sc li em{font-style:normal;color:var(--mut);font-size:12.5px;text-align:right}
.sc p{margin:8px 0 0;padding-top:8px;border-top:1px dashed var(--line);color:var(--mut);font-size:12.5px;line-height:1.5}
.sc svg{width:100px;height:auto;align-self:start;margin-top:24px}
footer{text-align:center;color:var(--mut);font-size:12px;padding:8px 16px 28px}
</style></head><body>
